[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cumcm-q1q2-proof-complete"
version = "7.0.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "shapely>=2.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
